<html lang="en">
    <body>





<main>
<form action="" method="POST">
    <form action="" method="">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Rene" required>
        <br>
        <label for="apPaterno">Apellido Paterno</label>
        <input type="text" id="apPaterno" placeholder="Vargas" required>
        <br>
        <label for="apMaterno">Apellido Materno</label>
        <input type="text" id="apMaterno" placeholder="Zarate" required>
        <br>
        <label for="genero">Genero</label>
        <select id="genero">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">Otro</option>
        </select>
        <br>
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="dato" id="fechaNacimiento">
        </fieldset>

        
        <fieldset>
            <legend>Datos de Contacto</legend>

            <label for="email">Correo electronico</label>
            <input type="email" id="email" placeholder="250962@utxicotepec.edu.mx">
            <br>
            <label for="numTelefonico">Numero Telefonico</label>
            <input type="tel" id="numTelefonico" placeholder="(55) 1234-5678">
            <br>
            <label for="horarioContacto">Horario de contacto</label>
            <input type="time" id="horarioContacto" placeholder="18.00">
        </fieldset>

        <fieldset>
            <legend>Datos de ubicacion</legend>
            <label for="direccion">Direccion</label>
            <input type="text" id="direccion" required placeholder="direccion">
            <br>
            <label for="pais">Pais</label>
            <input type="text" id="pais" placeholder="ej. Mexico" required>
            <br>
            <label for="estados">Estados</label>
            <input type="text" id="estados" placeholder="ej. Puebla" required>
            <br>
            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad " placeholder="ej. Huauchinango" required>
        </fieldset>

        <fieldset>
            <legend>Datos de acceso</legend>
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="User-1" required>
            <br>
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" placeholder="password" required>
            <br>
            <label for="confirmarContraseña">ConfirmarContraseña</label>
            <input type="password" id="confirmarContraseña" placeholder="confirmar contraseña" required>       
        </fieldset>
        
        
        
    </form>
</main>   
    </body> 
</html>
